# OneBranch pipeline for processing ADO-hosted repositories.
# This pipeline runs inside the internal ADO repo, so git commands
# executed via exec.Command have implicit access to internal repos.

trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: onboardDefs
      type: git
      name: private-test/private-test
      ref: refs/heads/main

pool:
  type: linux

steps:
  - checkout: self
    fetchDepth: 1

  - checkout: onboardDefs
    path: s/onboard-defs
    fetchDepth: 1

  - script: |
      go run .
    displayName: Run DALEC Mapping
    workingDirectory: $(Pipeline.Workspace)/s/dalec-mapping
    env:
      AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
      AZURE_OPENAI_KEY: $(AZURE_OPENAI_KEY)
      AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
